{% extends "base.html" %}
{% block title %}Edit course — StudyGenie{% endblock %}
{% block content %}
<h1>Edit course</h1>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="post" class="form">
  <label>Course name
    <input name="name" required maxlength="80" value="{{ name if name is defined else course.name }}">
  </label>
  <label>Exam date
    <input type="date" name="exam_date" required value="{{ exam_date if exam_date is defined else course.exam_date }}">
  </label>
  <div class="notes-actions">
    <button class="btn" type="submit">Save changes</button>
    <a class="btn small" href="{{ url_for('course_detail', course_id=course.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}

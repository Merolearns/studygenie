<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyGenie{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">&#128218; StudyGenie</a>
    <span class="tagline">turn your courses into a study plan</span>
    <nav>
      {% if current_user.is_authenticated %}
      <a class="nav-link" href="{{ url_for('plan') }}">&#128197; This week</a>
      <a class="nav-link" href="{{ url_for('progress_page') }}">&#128202; Progress</a>
      <a class="nav-link" href="{{ url_for('notes') }}">&#128221; Notes</a>
      <a class="nav-link" href="{{ url_for('flashcards') }}">&#127183; Cards</a>
      <a class="nav-link" href="{{ url_for('availability') }}">&#128197; Availability</a>
      <a class="nav-link" href="{{ url_for('account') }}">&#128100; Account</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="nav-link btn-link" type="submit">Log out</button>
      </form>
      {% else %}
      <a class="nav-link" href="{{ url_for('login') }}">Log in</a>
      <a class="nav-link" href="{{ url_for('register') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
